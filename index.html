<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videmy Infotech - Registration & Payment</title>
  
  <!-- Supabase JS Client library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Razorpay Checkout SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  
  <style>
    /* Global Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f2027 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #333333;
    }

    /* Container Card */
    .card-container {
      background: #ffffff;
      width: 100%;
      max-width: 550px;
      border-radius: 12px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    /* Header Section */
    .header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: #ffffff;
      padding: 25px 20px;
      text-align: center;
    }

    .company-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .address-info {
      font-size: 0.85rem;
      line-height: 1.4;
      color: #e0e7ff;
      max-width: 480px;
      margin: 0 auto;
    }

    /* Form Section */
    .body-content {
      padding: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    .required {
      color: #ef4444;
    }

    input[type="text"],
    input[type="email"],
    input[type="number"],
    input[type="tel"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 0.95rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      background-color: #f9fafb;
    }

    input:focus {
      border-color: #2563eb;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    /* Phone Input Layout */
    .phone-input-group {
      display: flex;
      gap: 10px;
    }

    .country-code {
      width: 70px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      background-color: #f3f4f6;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      text-align: center;
      color: #4b5563;
    }

    .phone-input-group input {
      flex: 1;
    }

    /* Terms Checkbox */
    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 20px;
      margin-bottom: 20px;
    }

    .checkbox-group input[type="checkbox"] {
      margin-top: 3px;
      width: 16px;
      height: 16px;
      accent-color: #2563eb;
      cursor: pointer;
    }

    .checkbox-label {
      font-size: 0.85rem;
      color: #4b5563;
      line-height: 1.4;
      cursor: pointer;
    }

    /* Submit Button */
    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      padding: 14px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .submit-btn:hover {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
    }

    .submit-btn:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <!-- Header Section -->
    <div class="header">
      <h1 class="company-title">VIDEMY INFOTECH PRIVATE LIMITED</h1>
      <p class="address-info">
        50-40-28, 4th floor, GMR arcade, Opposite co-operative bank, Tpt colony, Seethammadhara, Visakhapatnam, 530013
      </p>
    </div>

    <!-- Registration Form -->
    <div class="body-content">
      <form id="registrationForm" action="javascript:void(0);">

        <div class="form-group">
          <label for="name">Name <span class="required">*</span></label>
          <input type="text" id="name" required placeholder="Enter full name">
        </div>

        <div class="form-group">
          <label for="phone">Phone Number <span class="required">*</span></label>
          <div class="phone-input-group">
            <input type="text" class="country-code" value="+91" readonly>
            <input type="tel" id="phone" required placeholder="10-digit number" pattern="[0-9]{10}">
          </div>
        </div>

        <div class="form-group">
          <label for="parent_phone">Parent Number</label>
          <input type="tel" id="parent_phone" placeholder="Parent's phone number">
        </div>

        <div class="form-group">
          <label for="course">Course Name <span class="required">*</span></label>
          <input type="text" id="course" required placeholder="Enter course name">
        </div>

        <div class="form-group">
          <label for="employee_id">Videmy Employee ID</label>
          <input type="text" id="employee_id" placeholder="Optional">
        </div>

        <div class="form-group">
          <label for="email">Email ID <span class="required">*</span></label>
          <input type="email" id="email" required placeholder="example@domain.com">
        </div>

        <div class="form-group">
          <label for="amount">Amount (₹) <span class="required">*</span></label>
          <input type="number" id="amount" required min="1" placeholder="Enter amount">
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="terms" required>
          <label for="terms" class="checkbox-label">
            I agree to the Terms & Conditions and Privacy Policy <span class="required">*</span>
          </label>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">Proceed to Pay</button>
      </form>
    </div>
  </div>

  <script>
    // Supabase Configuration
    const SUPABASE_URL = "https://ncifgjiqkfckesudpanb.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_q7d7oGlD1J8RbKPApe11cQ_xFsZgJdL"; 

    // ⚠️ PASTE YOUR RAZORPAY TEST KEY ID HERE BELOW
    const RAZORPAY_KEY_ID = "rzp_test_TFjQ9NGFrP6QY9";

    window.onload = function() {
      if (!window.supabase) {
        alert("Supabase library failed to load. Please refresh the page.");
        return;
      }

      // Initialize Supabase Client
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const form = document.getElementById('registrationForm');
      const submitBtn = document.getElementById('submitBtn');

      form.addEventListener('submit', async function(event) {
        event.preventDefault(); // Prevent page reload

        submitBtn.disabled = true;
        submitBtn.innerText = "Saving Data...";

        // Capture Input Values
        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        const parent_phone = document.getElementById('parent_phone').value;
        const course = document.getElementById('course').value;
        const employee_id = document.getElementById('employee_id').value;
        const email = document.getElementById('email').value;
        const amount = parseFloat(document.getElementById('amount').value);

        try {
          // 1. Insert record into Supabase SQL Database
          const { data, error } = await supabase
            .from('registrations')
            .insert([
              {
                name: name,
                phone: phone,
                parent_phone: parent_phone,
                course: course,
                employee_id: employee_id,
                email: email,
                amount: amount,
                terms_agreed: true
              }
            ]);

          if (error) {
            console.error("Database Insert Error:", error);
            alert("Could not save registration details: " + error.message);
            submitBtn.disabled = false;
            submitBtn.innerText = "Proceed to Pay";
            return;
          }

          // 2. Open Razorpay Gateway Modal
          const options = {
            key: RAZORPAY_KEY_ID,
            amount: amount * 100, // Amount converted to paise (₹1 = 100 paise)
            currency: "INR",
            name: "Videmy Infotech Private Limited",
            description: `Course Fee - ${course}`,
            prefill: {
              name: name,
              email: email,
              contact: phone
            },
            theme: {
              color: "#2563eb"
            },
            handler: function (response) {
              alert(`Payment Successful! Payment ID: ${response.razorpay_payment_id}`);
              form.reset();
              submitBtn.disabled = false;
              submitBtn.innerText = "Proceed to Pay";
            },
            modal: {
              ondismiss: function() {
                submitBtn.disabled = false;
                submitBtn.innerText = "Proceed to Pay";
              }
            }
          };

          const rzp = new Razorpay(options);
          rzp.open();

        } catch (err) {
          console.error("Unexpected error:", err);
          alert("An error occurred: " + err.message);
          submitBtn.disabled = false;
          submitBtn.innerText = "Proceed to Pay";
        }
      });
    };
  </script>

</body>
</html>
