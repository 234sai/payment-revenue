<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videmy Infotech - Registration & Payment</title>
  
  <!-- Client-side QR Code library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <!-- Supabase JS Client library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    /* Global Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f2027 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #333333;
    }

    /* Container Card */
    .card-container {
      background: #ffffff;
      width: 100%;
      max-width: 550px;
      border-radius: 12px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    /* Header Section */
    .header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: #ffffff;
      padding: 25px 20px;
      text-align: center;
    }

    .company-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .address-info {
      font-size: 0.85rem;
      line-height: 1.4;
      color: #e0e7ff;
      max-width: 480px;
      margin: 0 auto;
    }

    /* Form Section */
    .body-content {
      padding: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    .required {
      color: #ef4444;
    }

    input[type="text"],
    input[type="email"],
    input[type="number"],
    input[type="tel"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 0.95rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      background-color: #f9fafb;
    }

    input:focus {
      border-color: #2563eb;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    /* Phone Input Layout */
    .phone-input-group {
      display: flex;
      gap: 10px;
    }

    .country-code {
      width: 70px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      background-color: #f3f4f6;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      text-align: center;
      color: #4b5563;
    }

    .phone-input-group input {
      flex: 1;
    }

    /* Terms Checkbox */
    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 20px;
      margin-bottom: 20px;
    }

    .checkbox-group input[type="checkbox"] {
      margin-top: 3px;
      width: 16px;
      height: 16px;
      accent-color: #2563eb;
      cursor: pointer;
    }

    .checkbox-label {
      font-size: 0.85rem;
      color: #4b5563;
      line-height: 1.4;
      cursor: pointer;
    }

    /* Submit Button */
    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      padding: 14px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .submit-btn:hover {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
    }

    .submit-btn:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    /* --- PAYMENT PAGE STYLES --- */
    #payment-section {
      display: none;
      text-align: center;
    }

    .pay-amount {
      font-size: 1.5rem;
      color: #1e293b;
      margin-bottom: 20px;
      font-weight: 700;
    }

    .copy-box {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 15px 0;
    }

    .copy-box input {
      width: 220px;
      text-align: center;
      font-weight: bold;
      background: #f3f4f6;
    }

    .copy-btn {
      padding: 10px 16px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .divider {
      margin: 15px 0;
      color: #6b7280;
      font-size: 0.85rem;
      font-weight: 600;
    }

    #qrcode {
      margin: 15px auto;
      display: flex;
      justify-content: center;
    }

    .utr-section {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px dashed #d1d5db;
      text-align: left;
    }

    .back-btn {
      background: none;
      border: none;
      color: #6b7280;
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: 15px;
      text-decoration: underline;
      display: block;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <!-- Header Section -->
    <div class="header">
      <h1 class="company-title">VIDEMY INFOTECH PRIVATE LIMITED</h1>
      <p class="address-info">
        50-40-28, 4th floor, GMR arcade, Opposite co-operative bank, Tpt colony, Seethammadhara, Visakhapatnam, 530013
      </p>
    </div>

    <!-- Page 1: Registration Form -->
    <div id="form-section" class="body-content">
      <form id="registrationForm" action="javascript:void(0);">

        <div class="form-group">
          <label for="name">Name <span class="required">*</span></label>
          <input type="text" id="name" required placeholder="Enter full name">
        </div>

        <div class="form-group">
          <label for="phone">Phone Number <span class="required">*</span></label>
          <div class="phone-input-group">
            <input type="text" class="country-code" value="+91" readonly>
            <input type="tel" id="phone" required placeholder="10-digit number" pattern="[0-9]{10}">
          </div>
        </div>

        <div class="form-group">
          <label for="parent_phone">Parent Number</label>
          <input type="tel" id="parent_phone" placeholder="Parent's phone number">
        </div>

        <div class="form-group">
          <label for="course">Course Name <span class="required">*</span></label>
          <input type="text" id="course" required placeholder="Enter course name">
        </div>

        <div class="form-group">
          <label for="employee_id">Videmy Employee ID</label>
          <input type="text" id="employee_id" placeholder="Optional">
        </div>

        <div class="form-group">
          <label for="email">Email ID <span class="required">*</span></label>
          <input type="email" id="email" required placeholder="example@domain.com">
        </div>

        <div class="form-group">
          <label for="amount">Amount (₹) <span class="required">*</span></label>
          <input type="number" id="amount" required min="1" placeholder="Enter amount">
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="terms" required>
          <label for="terms" class="checkbox-label">
            I agree to the Terms & Conditions and Privacy Policy <span class="required">*</span>
          </label>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">Proceed to Pay</button>
      </form>
    </div>

    <!-- Page 2: UPI Payment -->
    <div id="payment-section" class="body-content">
      <div class="pay-amount">Pay ₹<span id="display-amount">0.00</span></div>

      <p style="font-size: 0.9rem; color: #4b5563;">Scan QR code with GPay, PhonePe, or Paytm:</p>
      
      <!-- Generated QR Code Container -->
      <div id="qrcode"></div>

      <div class="divider">--- OR COPY UPI ID ---</div>

      <!-- Copy UPI ID Box -->
      <div class="copy-box">
        <input type="text" id="upiVpa" value="Q118568677@ybl" readonly>
        <button type="button" class="copy-btn" onclick="copyUPI()">Copy ID</button>
      </div>

      <!-- Step 3: Enter UTR to Verify and Save to Supabase -->
      <div class="utr-section">
        <div class="form-group">
          <label for="utr_number">Enter 12-Digit UPI Ref / UTR No. <span class="required">*</span></label>
          <input type="text" id="utr_number" placeholder="e.g. 4123XXXX5678" pattern="[0-9]{12}" maxlength="12">
        </div>
        <button type="button" id="confirmPayBtn" class="submit-btn" onclick="submitVerification()">Submit Payment Proof</button>
      </div>

      <button type="button" class="back-btn" onclick="goBack()">← Edit Registration Details</button>
    </div>
  </div>

  <script>
    let pendingData = null;
    let supabaseClient = null;

    window.onload = function() {
      // Supabase Configuration
      const SUPABASE_URL = "https://ncifgjiqkfckesudpanb.supabase.co"; 
      const SUPABASE_ANON_KEY = "sb_publishable_q7d7oGlD1J8RbKPApe11cQ_xFsZgJdL"; 

      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } else {
        alert("Supabase library failed to load. Please refresh the page.");
      }

      const form = document.getElementById('registrationForm');
      const formSection = document.getElementById('form-section');
      const paymentSection = document.getElementById('payment-section');
      const displayAmount = document.getElementById('display-amount');
      const qrContainer = document.getElementById('qrcode');

      const upiId = "Q118568677@ybl";
      const merchantName = "Videmy Infotech Private Limited";

      form.addEventListener('submit', function(event) {
        event.preventDefault();

        // 1. Store inputs in memory
        pendingData = {
          name: document.getElementById('name').value,
          phone: document.getElementById('phone').value,
          parent_phone: document.getElementById('parent_phone').value,
          course: document.getElementById('course').value,
          employee_id: document.getElementById('employee_id').value,
          email: document.getElementById('email').value,
          amount: parseFloat(document.getElementById('amount').value),
          terms_agreed: true
        };

        const formattedAmount = pendingData.amount.toFixed(2);
        displayAmount.innerText = formattedAmount;

        // 2. Generate Dynamic UPI string for QR Code
        const note = `Fee - ${pendingData.name}`;
        const upiLink = `upi://pay?pa=${encodeURIComponent(upiId)}&pn=${encodeURIComponent(merchantName)}&am=${formattedAmount}&cu=INR&tn=${encodeURIComponent(note)}`;

        qrContainer.innerHTML = "";
        new QRCode(qrContainer, {
          text: upiLink,
          width: 160,
          height: 160
        });

        // 3. Switch view to Payment Section
        formSection.style.display = 'none';
        paymentSection.style.display = 'block';
      });
    };

    // Helper: Copy UPI ID to Clipboard
    function copyUPI() {
      const vpaField = document.getElementById("upiVpa");
      vpaField.select();
      navigator.clipboard.writeText(vpaField.value);
      alert("UPI ID copied to clipboard! Open GPay or PhonePe, paste this UPI ID, and make the payment.");
    }

    // Helper: Verify UTR & Save to Supabase
    async function submitVerification() {
      const utrInput = document.getElementById('utr_number').value.trim();
      const confirmBtn = document.getElementById('confirmPayBtn');

      if (!utrInput || utrInput.length !== 12 || isNaN(utrInput)) {
        alert("Please enter a valid 12-digit UPI UTR / Transaction Reference Number.");
        return;
      }

      if (!pendingData || !supabaseClient) {
        alert("Session error. Please edit details and try again.");
        return;
      }

      confirmBtn.disabled = true;
      confirmBtn.innerText = "Submitting...";

      // Attach UTR and status
      pendingData.utr_number = utrInput;
      pendingData.payment_status = "Pending Verification";

      try {
        const { data, error } = await supabaseClient
          .from('registrations')
          .insert([pendingData]);

        if (error) {
          alert("Error saving record: " + error.message);
          confirmBtn.disabled = false;
          confirmBtn.innerText = "Submit Payment Proof";
          return;
        }

        alert("Payment proof submitted successfully! We will verify your transaction shortly.");
        location.reload();

      } catch (err) {
        alert("Unexpected error: " + err.message);
        confirmBtn.disabled = false;
        confirmBtn.innerText = "Submit Payment Proof";
      }
    }

    function goBack() {
      document.getElementById('payment-section').style.display = 'none';
      document.getElementById('form-section').style.display = 'block';
    }
  </script>

</body>
</html>
